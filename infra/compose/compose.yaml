# Local development infrastructure for ControlHub.
#
# Usage (via justfile): docker compose --env-file .controlhub/infra.env -f infra/compose/compose.yaml up -d
# Credentials are generated by `just bootstrap` into the gitignored .controlhub/ directory.
# All ports bind to 127.0.0.1 only. This is a single-node setup: it does NOT
# provide production durability (no replication, fsync defaults, single broker).
#
# Approximate resources: ~2.5 GB RAM total (Kafka ~1 GB, ClickHouse ~1 GB, Postgres ~200 MB).

name: controlhub

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: controlhub
      POSTGRES_USER: ${CH_PG_ADMIN_USER:?run just bootstrap}
      POSTGRES_PASSWORD: ${CH_PG_ADMIN_PASSWORD:?run just bootstrap}
    ports:
      - "127.0.0.1:${CH_PG_PORT:-15432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d controlhub"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: controlhub
      CLICKHOUSE_USER: ${CH_CH_ADMIN_USER:?run just bootstrap}
      CLICKHOUSE_PASSWORD: ${CH_CH_ADMIN_PASSWORD:?run just bootstrap}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CH_CLICKHOUSE_HTTP_PORT:-18123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 60s

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:${CH_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "72"
      KAFKA_MESSAGE_MAX_BYTES: "8388608"
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms256m"
    ports:
      - "127.0.0.1:${CH_KAFKA_PORT:-19092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    stop_grace_period: 60s

  # Database of the demo system (examples/demo-system). Demo-only; separate
  # from ControlHub's own metadata database. Started with `--profile demo`.
  demo-postgres:
    image: postgres:17.6-alpine
    profiles: ["demo"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${CH_DEMO_PG_PASSWORD:?run just bootstrap}
    ports:
      - "127.0.0.1:${CH_DEMO_PG_PORT:-15433}:5432"
    volumes:
      - demo-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg-data:
  clickhouse-data:
  clickhouse-logs:
  kafka-data:
  demo-pg-data:
