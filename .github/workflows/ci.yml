name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  WASM_BINDGEN_VERSION: "0.2.129"

jobs:
  rust:
    name: Rust (fmt, clippy, tests, wasm32 check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (pinned channel, components and wasm32 target).
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check -p controlhub-engine-core -p controlhub-web-engine --target wasm32-unknown-unknown --locked

  web:
    name: WASM, codegen drift, web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install wasm-bindgen-cli (version must match the wasm-bindgen crate)
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: node scripts/build-wasm.mjs
      - name: Generated contracts are up to date
        run: |
          node scripts/codegen.mjs
          git diff --exit-code -- schemas/generated packages/web-engine/src/generated packages/api-client/src/generated
          test -z "$(git status --porcelain -- schemas/generated packages/web-engine/src/generated packages/api-client/src/generated)"
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @controlhub/web lint
      - run: pnpm --filter @controlhub/sdk-node test
      - run: pnpm --filter @controlhub/web build
