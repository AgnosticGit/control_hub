[package]
name = "karbird-cli"
description = "karbird CLI: discover, plan, apply and verify a karbird integration; read-only context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "karbird"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
time.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
similar = "2"

[dev-dependencies]
criterion.workspace = true
tempfile = "3"

[[bench]]
name = "discovery"
harness = false

[lints]
workspace = true
