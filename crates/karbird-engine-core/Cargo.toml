[package]
name = "controlhub-engine-core"
description = "Pure computational core for the ControlHub viewer (native + wasm32, no I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables TypeScript binding export (used only by codegen, never in the WASM build).
ts = ["dep:ts-rs"]
# OpenAPI schema derives, used by controlhub-api (never in the WASM build).
openapi = ["dep:utoipa"]

[dependencies]
utoipa = { version = "5", optional = true, default-features = false, features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
controlhub-domain.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
