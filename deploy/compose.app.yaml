# karbird production, host "app": Kafka, the Rust services, the web app and Caddy (TLS).
# Lives in /opt/karbird next to .env and Caddyfile (rendered by the deploy workflow).
# Only Caddy is reachable from the internet (80/443); everything else stays on the Docker network.
#   docker compose -f compose.app.yaml up -d --wait

name: karbird

x-service: &service
  restart: unless-stopped
  stop_grace_period: 30s

x-storage: &storage
  KARBIRD_ENV: production
  KARBIRD_LOG_FORMAT: json
  KARBIRD_CLICKHOUSE_URL: http://${STORAGE_ADDR:?rendered by the deploy}:8123
  KARBIRD_CLICKHOUSE_DATABASE: karbird

x-retention: &retention
  KARBIRD_LOGS_RETENTION_DAYS: ${KARBIRD_LOGS_RETENTION_DAYS:-14}
  KARBIRD_SPANS_RETENTION_DAYS: ${KARBIRD_SPANS_RETENTION_DAYS:-14}
  KARBIRD_EVENTS_RETENTION_DAYS: ${KARBIRD_EVENTS_RETENTION_DAYS:-30}
  KARBIRD_METRICS_RETENTION_DAYS: ${KARBIRD_METRICS_RETENTION_DAYS:-14}

services:
  kafka:
    <<: *service
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "72"
      KAFKA_MESSAGE_MAX_BYTES: "8388608"
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms256m"
      # 1/8 OCPU: the in-process broker -> controller heartbeat misses the 2 s defaults and the
      # broker never gets ready. Longer intervals and a single-core JVM (serial GC, C1 only).
      KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: "10000"
      KAFKA_BROKER_SESSION_TIMEOUT_MS: "60000"
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: "20000"
      KAFKA_CONTROLLER_QUORUM_FETCH_TIMEOUT_MS: "40000"
      KAFKA_CONTROLLER_SOCKET_TIMEOUT_MS: "60000"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ActiveProcessorCount=1 -XX:CICompilerCount=1 -Djava.awt.headless=true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # A port check: the CLI health probe starts a second JVM, which a 1/8 core cannot afford.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/19092' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 180s
    stop_grace_period: 60s

  ingest:
    <<: *service
    image: ${IMAGE_PREFIX:?rendered by the deploy}/karbird-ingest:${KARBIRD_VERSION:?rendered by the deploy}
    environment:
      KARBIRD_ENV: production
      KARBIRD_LOG_FORMAT: json
      KARBIRD_KAFKA_BROKERS: kafka:19092
      KARBIRD_INGEST_HTTP_ADDR: 0.0.0.0:4318
      KARBIRD_INGEST_GRPC_ADDR: 0.0.0.0:4317
      KARBIRD_INGEST_DATABASE_URL: postgres://karbird_ingest:${CH_PG_INGEST_PASSWORD:?rendered by the deploy}@${STORAGE_ADDR}:5432/karbird
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4318/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  processor:
    <<: *service
    image: ${IMAGE_PREFIX}/karbird-processor:${KARBIRD_VERSION}
    environment:
      <<: *storage
      KARBIRD_KAFKA_BROKERS: kafka:19092
      KARBIRD_PROCESSOR_DATABASE_URL: postgres://karbird_processor:${CH_PG_PROCESSOR_PASSWORD:?rendered by the deploy}@${STORAGE_ADDR}:5432/karbird
      KARBIRD_PROCESSOR_CLICKHOUSE_USER: karbird_processor
      KARBIRD_PROCESSOR_CLICKHOUSE_PASSWORD: ${CH_CH_PROCESSOR_PASSWORD:?rendered by the deploy}
    depends_on:
      kafka: { condition: service_healthy }

  api:
    <<: *service
    image: ${IMAGE_PREFIX}/karbird-api:${KARBIRD_VERSION}
    command: ["serve"]
    environment:
      <<: [*storage, *retention]
      KARBIRD_KAFKA_BROKERS: kafka:19092
      KARBIRD_LIVE_GROUP_ID: karbird-live-api
      KARBIRD_API_ADDR: 0.0.0.0:8080
      KARBIRD_API_DATABASE_URL: postgres://karbird_api:${CH_PG_API_PASSWORD:?rendered by the deploy}@${STORAGE_ADDR}:5432/karbird
      KARBIRD_API_CLICKHOUSE_USER: karbird_api
      KARBIRD_API_CLICKHOUSE_PASSWORD: ${CH_CH_API_PASSWORD:?rendered by the deploy}
      KARBIRD_ALLOWED_ORIGINS: https://${KARBIRD_DOMAIN:?rendered by the deploy}
      KARBIRD_SIGNUP: ${KARBIRD_SIGNUP:-open}
      KARBIRD_SIGNUP_PER_HOUR: ${KARBIRD_SIGNUP_PER_HOUR:-20}
      KARBIRD_PUBLIC_URL: ${KARBIRD_PUBLIC_URL:?rendered by the deploy}
      KARBIRD_GOOGLE_CLIENT_ID: ${KARBIRD_GOOGLE_CLIENT_ID:-}
      KARBIRD_GOOGLE_CLIENT_SECRET: ${KARBIRD_GOOGLE_CLIENT_SECRET:-}
      KARBIRD_GOOGLE_REDIRECT_URL: ${KARBIRD_GOOGLE_REDIRECT_URL:-}
      KARBIRD_RESEND_API_KEY: ${KARBIRD_RESEND_API_KEY:-}
      KARBIRD_MAIL_FROM: ${KARBIRD_MAIL_FROM:-}
      KARBIRD_MAIL_ENABLED: ${KARBIRD_MAIL_ENABLED:-false}
      KARBIRD_ARCHIVE_S3_ENDPOINT: http://${STORAGE_ADDR}:8333
      KARBIRD_ARCHIVE_S3_BUCKET: ${ARCHIVE_BUCKET:-karbird-archive}
      KARBIRD_API_S3_ACCESS_KEY: ${CH_S3_API_ACCESS_KEY:?rendered by the deploy}
      KARBIRD_API_S3_SECRET_KEY: ${CH_S3_API_SECRET_KEY:?rendered by the deploy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 30s

  executor:
    <<: *service
    image: ${IMAGE_PREFIX}/karbird-executor:${KARBIRD_VERSION}
    environment:
      <<: *storage
      KARBIRD_EXECUTOR_DATABASE_URL: postgres://karbird_executor:${CH_PG_EXECUTOR_PASSWORD:?rendered by the deploy}@${STORAGE_ADDR}:5432/karbird
      KARBIRD_EXECUTOR_CLICKHOUSE_USER: karbird_executor
      KARBIRD_EXECUTOR_CLICKHOUSE_PASSWORD: ${CH_CH_EXECUTOR_PASSWORD:?rendered by the deploy}

  archiver:
    <<: *service
    image: ${IMAGE_PREFIX}/karbird-archiver:${KARBIRD_VERSION}
    command: ["run"]
    environment:
      <<: [*storage, *retention]
      KARBIRD_ARCHIVER_DATABASE_URL: postgres://karbird_archiver:${CH_PG_ARCHIVER_PASSWORD:?rendered by the deploy}@${STORAGE_ADDR}:5432/karbird
      KARBIRD_ARCHIVER_CLICKHOUSE_USER: karbird_archiver
      KARBIRD_ARCHIVER_CLICKHOUSE_PASSWORD: ${CH_CH_ARCHIVER_PASSWORD:?rendered by the deploy}
      KARBIRD_ARCHIVE_S3_ENDPOINT: http://${STORAGE_ADDR}:8333
      KARBIRD_ARCHIVE_S3_BUCKET: ${ARCHIVE_BUCKET:-karbird-archive}
      KARBIRD_ARCHIVER_S3_ACCESS_KEY: ${CH_S3_ARCHIVER_ACCESS_KEY:?rendered by the deploy}
      KARBIRD_ARCHIVER_S3_SECRET_KEY: ${CH_S3_ARCHIVER_SECRET_KEY:?rendered by the deploy}

  web:
    <<: *service
    image: ${IMAGE_PREFIX}/karbird-web:${KARBIRD_VERSION}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  caddy:
    <<: *service
    image: caddy:2.10.2-alpine
    environment:
      KARBIRD_DOMAIN: ${KARBIRD_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?rendered by the deploy}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, ingest, web]

volumes:
  kafka-data:
  caddy-data:
  caddy-config:
