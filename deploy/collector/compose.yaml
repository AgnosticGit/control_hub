# Karbird Collector for one machine: machine and container metrics -> karbird ingest.
# Run on every machine whose services you want on the map's Infrastructure layer:
#   KARBIRD_OTLP_ENDPOINT=https://karbird.example.com/otlp KARBIRD_INGEST_TOKEN=... KARBIRD_HOST_NAME=vps-app \
#     docker compose -f compose.yaml up -d
# The services' karbird SDK must report the same host.name (KARBIRD_HOST_NAME) to be matched.

name: karbird-collector

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ["--config=/etc/karbird/collector.yaml"]
    # Reads the Docker socket for container stats; the host filesystem is mounted read-only.
    user: "0:0"
    environment:
      KARBIRD_OTLP_ENDPOINT: ${KARBIRD_OTLP_ENDPOINT:?karbird ingest base URL}
      KARBIRD_INGEST_TOKEN: ${KARBIRD_INGEST_TOKEN:?ingest token with the metrics signal}
      KARBIRD_HOST_NAME: ${KARBIRD_HOST_NAME:?machine name shown on the map}
    volumes:
      - ./karbird-collector.yaml:/etc/karbird/collector.yaml:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    cpus: 0.2
  postgres:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: ["postgres"]
    restart: unless-stopped
    command: ["--config=/etc/karbird/postgres-collector.yaml"]
    environment:
      KARBIRD_OTLP_ENDPOINT: ${KARBIRD_OTLP_ENDPOINT:?karbird ingest base URL}
      KARBIRD_INGEST_TOKEN: ${KARBIRD_INGEST_TOKEN:?metrics ingest token}
      KARBIRD_HOST_NAME: ${KARBIRD_HOST_NAME:?machine name}
      KARBIRD_POSTGRES_ENDPOINT: ${KARBIRD_POSTGRES_ENDPOINT:?PostgreSQL host:port}
      KARBIRD_POSTGRES_USER: ${KARBIRD_POSTGRES_USER:?read-only monitoring user}
      KARBIRD_POSTGRES_PASSWORD: ${KARBIRD_POSTGRES_PASSWORD:?monitoring password}
      KARBIRD_POSTGRES_DATABASE: ${KARBIRD_POSTGRES_DATABASE:?database to monitor}
    volumes:
      - ./postgres-collector.yaml:/etc/karbird/postgres-collector.yaml:ro
    mem_limit: 128m
    cpus: 0.2
